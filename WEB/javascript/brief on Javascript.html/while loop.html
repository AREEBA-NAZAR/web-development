<!DOCTYPE html>
<html>
<head>
    <title>Random Numbers</title>
</head>
<body>

<h2>Random Numbers:</h2>
<div id="output"></div>

<script>
    let count = 0;
    let result = "";

    while (count < 5) {
        let randomNum = Math.floor(Math.random() * 100);
        result += randomNum + "<br>";
        count++;
    }

    document.getElementById("output").innerHTML = result;
</script>

</body>
</html>
