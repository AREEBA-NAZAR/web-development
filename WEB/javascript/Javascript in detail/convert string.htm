<!DOCTYPE htm>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Convert String to Number</h2>
    
    <p id="output"></p>
    <p id="output2"></p>
<script>
var x = 30;
var y = 90;

document.getElementById("output").innerHTML = "The sum of x and y is: " + (x + y);
document.getElementById("output2").innerHTML = String(x) + String(y);

</script>
</body>
</html>
